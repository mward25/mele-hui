[build-system]

requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project]

name = "com.trumpetrespas.melehui"
version = "0.3.0"
requires-python = ">=3.11"
authors = [{name = "Miles Ward", email = "milesward2004@gmail.com"}]
# maintainers = [{name = "Example Author", email = "example@author.org"}]
description = "A simple sheet music reading program."
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Utilities",
    "Programming Language :: Python",
    "Operating System :: POSIX :: Linux",
]
keywords = ["viewer music"]
urls = {Homepage = "https://github.com/mward25/mele-hui"}
dependencies = [
    "pyocr",
    "opencv-python",
    "sqlalchemy",
    "alembic",
    "PySide6",
    "pikepdf>=10.18.0",
    "pymupdf>=2.1",
]


[project.readme]

file = "README.md"
content-type = "text/markdown"

[project.scripts]
melehui = "melehui_app:main"

[tool.setuptools]
package-dir = {"" = "app/src"}
include-package-data = true
py-modules = ["auto_cropper", "auto_namer", "camera_backend", "melehui_app", "setlist_backend", "setlist_gallery_list", "setlist_view", "song_backend", "song_gallery_list", "song_view"]

[tool.setuptools.packages.find]
where = ["app/src"]

[tool.pyside6-project]
files = [
    # Python Files
    "app/src/auto_cropper.py",
    "app/src/auto_namer.py",
    "app/src/camera_backend.py",
    "app/src/melehui_app.py",
    "app/src/setlist_backend.py",
    "app/src/setlist_gallery_list.py",
    "app/src/setlist_view.py",
    "app/src/song_backend.py",
    "app/src/song_gallery_list.py",
    "app/src/song_view.py",

    # QML Files
    "app/src/qml/Camera.qml",
    "app/src/qml/DrawingOverlay.qml",
    "app/src/qml/DrawingToolbar.qml",
    "app/src/qml/ImagePicker.qml",
    "app/src/qml/PdfPicker.qml",
    "app/src/qml/main.qml",
    "app/src/qml/NewSetlist.qml",
    "app/src/qml/NewSong.qml",
    "app/src/qml/PageConfirmDialog.qml",
    "app/src/qml/SetlistGallery.qml",
    "app/src/qml/SetlistViewer.qml",
    "app/src/qml/SongGallery.qml",
    "app/src/qml/SongSelector.qml",
    "app/src/qml/SongViewer.qml"
]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]

[tool.setuptools.data-files]
"share/applications" = ["com.trumpetrespas.melehui.desktop"]
"share/icons/hicolor/scalable/apps" = ["com.trumpetrespas.melehui.svg"]
"share/metainfo" = ["com.trumpetrespas.melehui.xml"]

[tool.setuptools.package-data]
db = ["migrations/*", "migrations/**/*"]
qml = ["*.qml"]
