fail_fast: false
exclude: extlibs
repos:
  - repo: https://github.com/tomas-krupa/qmlformat-hook.git
    rev: 1.2.0
    hooks:
      - id: qmlformat
        args: ["--inplace"]
        additional_dependencies:
          - PySide6-Essentials==6.11.0 # override version of Qt Python metapackagerepos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
